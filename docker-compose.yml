services:
  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "8025:8025"
      - "1025:1025"

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9100:9000"
      - "9101:9001"
    volumes:
      - minio-data:/data

  user-service:
    build:
      context: ./services/user-service
    ports:
      - "8004:8004"
    environment:
      EMAIL_BACKEND: "django.core.mail.backends.smtp.EmailBackend" 
      EMAIL_HOST: "mailhog"
      EMAIL_PORT: "1025"
      EMAIL_USE_TLS: "false"
      DEFAULT_FROM_EMAIL: "no-reply@crm.local"
    volumes:
      - ./databases:/app/databases
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8004"

  contact-service:
    build:
      context: ./services/contact_service
    ports:
      - "8005:8005"
    depends_on:
      - user-service
    volumes:
      - ./databases:/app/databases
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8005"

  calendar:
    build:
      context: ./services/calendar
    ports:
      - "8006:8006"
    depends_on:
      - user-service
    volumes:
      - ./databases:/app/databases
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8006"

  marketing:
    build:
      context: ./services/marketing
    ports:
      - "8007:8007"
    environment:
      GATEWAY_URL: "http://api-gateway:8000" # os.environ.get('GATEWAY_URL').
    depends_on:
      - user-service
    volumes:
      - ./databases:/app/databases
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8007"

  documents:
    build:
      context: ./services/documents
    ports:
      - "8008:8008"
    environment:
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ACCESS_KEY: "minioadmin"
      MINIO_SECRET_KEY: "minioadmin"
      MINIO_BUCKET: "client-documents"
      MINIO_SECURE: "false"
    depends_on:
      - minio
      - user-service
    volumes:
      - ./databases:/app/databases
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8008"

  applications:
    build:
      context: ./services/applications
    ports:
      - "8009:8009"
    environment:
      YANDEX_IMAP_HOST: "imap.yandex.ru"
      YANDEX_EMAIL: "ehsonboboev7@yandex.ru"
      YANDEX_PASSWORD: "hbewwdgiloviutid"
      YANDEX_TARGET_SENDER: "69aeaa09eb6146cd4fd99c6b@forms.yandex.com"
    depends_on:
      - user-service
    volumes:
      - ./databases:/app/databases
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8009"

  chat-service:
    build:
      context: ./services/chatService
    ports:
      - "8010:8010"
    environment:
      TELEGRAM_BRIDGE_SECRET: "${TELEGRAM_BRIDGE_SECRET:-crm-telegram-bridge-2026}"
      TELEGRAM_MANAGER_IDS: "${TELEGRAM_MANAGER_IDS:-1}"
      TELEGRAM_MANAGER_ROLE: "${TELEGRAM_MANAGER_ROLE:-manager}"
    depends_on:
      - user-service
    volumes:
      - ./databases:/app/databases
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8010"

  payments:
    build:
      context: ./services/payments
    ports:
      - "8012:8012"
    environment:
      CONTACT_SERVICE_URL: "http://contact-service:8005"
      PUBLIC_PAYMENTS_BASE_URL: "${PUBLIC_PAYMENTS_BASE_URL:-https://incessantly-golden-gannet.cloudpub.ru}"
      ONEC_TRANSPORT_MODE: "bridge"
      ONEC_ODATA_BASE_URL: "http://host.docker.internal/1c/odata/standard.odata/"
      ONEC_BRIDGE_URL: "http://host.docker.internal:8013/invoke"
      ONEC_BRIDGE_SECRET: "${ONEC_BRIDGE_SECRET:-crm-onec-bridge-secret-2026}"
      ONEC_HEALTHCHECK_PATH: "$metadata"
      ONEC_RESTART_EACH_REQUEST: "true"
      ONEC_PAYMENT_INVOICE_FIELD: "${ONEC_PAYMENT_INVOICE_FIELD:-Счет_Key}"
      DEFAULT_FROM_EMAIL: "no-reply@crm.local"
      EMAIL_BACKEND: "django.core.mail.backends.smtp.EmailBackend"
      EMAIL_HOST: "mailhog"
      EMAIL_PORT: "1025"
      EMAIL_USE_TLS: "false"
    depends_on:
      - contact-service
      - mailhog
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./databases:/app/databases
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8012"

  payments-retry-worker:
    build:
      context: ./services/payments
    environment:
      CONTACT_SERVICE_URL: "http://contact-service:8005"
      PUBLIC_PAYMENTS_BASE_URL: "${PUBLIC_PAYMENTS_BASE_URL:-https://incessantly-golden-gannet.cloudpub.ru}"
      ONEC_TRANSPORT_MODE: "bridge"
      ONEC_ODATA_BASE_URL: "http://host.docker.internal/1c/odata/standard.odata/"
      ONEC_BRIDGE_URL: "http://host.docker.internal:8013/invoke"
      ONEC_BRIDGE_SECRET: "${ONEC_BRIDGE_SECRET:-crm-onec-bridge-secret-2026}"
      ONEC_HEALTHCHECK_PATH: "$metadata"
      ONEC_RESTART_EACH_REQUEST: "true"
      ONEC_PAYMENT_INVOICE_FIELD: "${ONEC_PAYMENT_INVOICE_FIELD:-Счет_Key}"
      INVOICE_RETRY_WORKER_INTERVAL_SECONDS: "30"
    depends_on:
      - payments
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./databases:/app/databases
    command: sh -c "python manage.py migrate && python manage.py process_invoice_retries --loop"

  tgbots:
    build:
      context: ./services/tgbots
    environment:
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-8795868534:AAGhWziwIb7xFA-SFQ-VXh59Vfl9otrvDvg}"
      TELEGRAM_BRIDGE_SECRET: "${TELEGRAM_BRIDGE_SECRET:-crm-telegram-bridge-2026}"
      CHAT_SERVICE_URL: "http://chat-service:8010"
      TELEGRAM_POLL_TIMEOUT: "5"
      TELEGRAM_IDLE_SLEEP: "0.4"
      TELEGRAM_WELCOME_TEXT: "Привет! Это CRM-бот. Напишите сообщение, и менеджер ответит вам в этом чате."
    depends_on:
      - chat-service
    command: sh -c "python bot.py"

  api-gateway:
    build:
      context: ./api-gateway
    ports:
      - "8000:8000"
    environment:
      USER_SERVICE_URL: "http://user-service:8004"
      CONTACT_SERVICE_URL: "http://contact-service:8005"
      TASKS_SERVICE_URL: "http://calendar:8006"
      MARKETING_SERVICE_URL: "http://marketing:8007"
      DOCUMENTS_SERVICE_URL: "http://documents:8008"
      CHAT_SERVICE_URL: "http://chat-service:8010"
      PAYMENTS_SERVICE_URL: "http://payments:8012"
    depends_on:
      - user-service
      - contact-service
      - calendar
      - marketing
      - documents
      - chat-service
      - payments
    volumes:
      - ./databases:/app/databases
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"

  frontend:
    build:
      context: ./frontend/vue-project
    ports:
      - "3000:3000"
    environment:
      VITE_PROXY_TARGET: "http://api-gateway:8000"
      VITE_APPLICATIONS_API_URL: "http://localhost:8009/api/applications/"
    depends_on:
      - api-gateway
      - applications

volumes:
  minio-data:

